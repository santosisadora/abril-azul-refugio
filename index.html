<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abril Azul - Refúgio Sensorial</title>
    <!-- SEO -->
    <meta name="description" content="Um refúgio sensorial imersivo para adultos em busca de diagnóstico de autismo. Informação, acolhimento e validação.">
    
    <!-- A-Frame and Components -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <!-- Icons and Fonts -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Overlay UI -->
    <div id="ui-overlay" class="ui-overlay">
        <header>
            <div class="logo-container">
                <i class="ph-bold ph-brain"></i>
                <h1>ABRIL AZUL | REFÚGIO SENSORIAL</h1>
            </div>
            <p>Explore o ambiente focando nos pontos de interesse</p>
        </header>

        <!-- Dynamic Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content glass">
                <span class="close-button"><i class="ph ph-x"></i></span>
                <div id="modal-body">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <footer>
            <button id="btn-toggle-audio" class="btn-audio">
                <i class="ph-bold ph-speaker-slash"></i> Áudio Ambiente
            </button>
        </footer>
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        id="main-scene"
        renderer="antialias: true; colorManagement: true; exposure: 1.1; shadowMapEnabled: true"
        loading-screen="backgroundColor: #f8f1e5; dotsColor: #4a90e2"
    >
        <!-- Assets -->
        <a-assets>
            <audio id="ambient-sound" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" preload="auto" loop="true"></audio>
        </a-assets>

        <!-- Room Architecture (The Safe Room) -->
        <a-sky color="#f8f1e5"></a-sky> 
        
        <!-- Floor & Walls -->
        <a-plane position="0 0.01 0" rotation="-90 0 0" width="10" height="10" color="#f2e9e4" material="roughness: 0.8" shadow="receive: true"></a-plane>
        <a-circle position="0 0.02 0" rotation="-90 0 0" radius="2.5" color="#d4a373" material="opacity: 0.3" shadow="receive: true"></a-circle> <!-- Rug -->

        <!-- Wall Panels for "High-Tech" look -->
        <a-box position="0 2.5 -4.95" width="10" height="5" depth="0.05" color="#f2e9e4" material="roughness: 1" shadow="receive: true"></a-box> <!-- Front Wall -->
        <a-box position="0 1.5 -4.92" width="6" height="3" depth="0.02" color="#e8dfd1" material="opacity: 0.5"></a-box> <!-- Decorative Panel -->
        
        <a-box position="-4.95 2.5 0" rotation="0 90 0" width="10" height="5" depth="0.05" color="#f2e9e4" material="roughness: 1"></a-box> <!-- Left Wall -->
        <a-box position="4.95 2.5 0" rotation="0 -90 0" width="10" height="5" depth="0.05" color="#c9ada7" material="roughness: 1"></a-box> <!-- Right Wall -->

        <!-- Window (Light Source) -->
        <a-plane id="window-frame" position="-4.9 2.2 0" rotation="0 90 0" width="3.2" height="3.2" color="#333" material="roughness: 0.2"></a-plane>
        <a-plane id="window" position="-4.88 2.2 0" rotation="0 90 0" width="3" height="3" color="#fff" material="shader: flat; opacity: 1"></a-plane>
        <a-light type="directional" position="-5 4 0" intensity="0.9" color="#fff1e0" castShadow="true"></a-light>

        <!-- DESIGNATED HOTSPOTS AND OBJECTS -->
        
        <!-- 1. The Mirror (Masking) -->
        <a-entity position="-2.5 0 -4">
            <!-- Mirror Frame -->
            <a-box position="0 1.25 0" width="1.1" height="2.1" depth="0.1" color="#d4a373"></a-box>
            <a-box 
                id="obj-mirror"
                class="clickable"
                position="0 1.25 0.06"
                width="1" height="2" depth="0.02"
                color="#a8d8ea"
                material="roughness: 0.1; metalness: 0.9; emissive: #a8d8ea; emissiveIntensity: 0.1"
                data-title="O Espelho"
                data-content="Social Masking é a camuflagem de traços autistas para se ajustar socialmente. <br><br> 🎭 <b>A Camuflagem Social:</b> Pode causar esgotamento extremo e perda de identidade."
            >
                <!-- Holographic Label -->
                <a-entity look-at="[camera]" position="0 1.3 0.1">
                    <a-text value="MASKING" align="center" width="4" color="#4a90e2" font="exo2bold"
                            animation="property: opacity; from: 0.6; to: 1; dir: alternate; loop: true; dur: 2000"></a-text>
                </a-entity>
            </a-box>
            <a-circle rotation="-90 0 0" radius="0.35" color="#4a90e2" opacity="0.3" 
                      animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 1500"></a-circle>
        </a-entity>

        <!-- 2. The Bookshelf (Resources) -->
        <a-entity position="4 0 -2.5" rotation="0 -45 0">
            <a-box position="0 1.2 0" width="1.3" height="2.4" depth="0.4" color="#9a8c98">
                <!-- Shelves -->
                <a-box position="0 0.4 0.1" width="1.2" height="0.05" depth="0.35" color="#c9ada7"></a-box>
                <a-box position="0 -0.4 0.1" width="1.2" height="0.05" depth="0.35" color="#c9ada7"></a-box>
            </a-box>
            <a-entity id="obj-bookshelf" class="clickable" position="0 1.2 0.3"
                data-title="Estante de Livros"
                data-content="Informação de qualidade é essencial. <br><br> 📚 <b>Recursos:</b> ABRAÇA, Livros sobre Diagnóstico Tardio e Artigos Científicos.">
                <a-entity look-at="[camera]">
                    <a-text value="RECURSOS" align="center" width="4" color="#4a90e2" font="exo2bold"
                            animation="property: opacity; from: 0.6; to: 1; dir: alternate; loop: true; dur: 1800"></a-text>
                </a-entity>
            </a-entity>
            <a-circle rotation="-90 0 0" radius="0.4" color="#4a90e2" opacity="0.3"></a-circle>
        </a-entity>

        <!-- 3. The Headphones (Sensory) -->
        <a-entity position="-4.5 1.8 1.5" rotation="0 90 0">
            <a-sphere 
                id="obj-headphones"
                class="clickable"
                radius="0.4"
                color="#4a4a4a"
                material="metalness: 0.6; roughness: 0.2"
                data-title="Fone de Ouvido"
                data-content="🎧 <b>Sobrecarga Sensorial:</b> A hipersensibilidade auditiva faz com que sons do dia-a-dia sejam processados como ruídos intensos e exaustivos."
            >
                <a-entity look-at="[camera]" position="0 0.7 0">
                    <a-text value="CONFORTO ACÚSTICO" align="center" width="3.5" color="#4a90e2" font="exo2bold"></a-text>
                </a-entity>
            </a-sphere>
            <a-circle rotation="-90 0 0" position="0 -0.5 0" radius="0.3" color="#4a90e2" opacity="0.3"></a-circle>
        </a-entity>

        <!-- 4. The Laptop (Refined) -->
        <a-entity position="0 0 -3">
            <!-- High-Tech Desk -->
            <a-box position="0 0.7 0" width="2" height="0.08" depth="0.9" color="#e8dfd1" material="roughness: 0.3"></a-box>
            <a-box position="-0.9 0.35 0.35" width="0.1" height="0.7" depth="0.1" color="#9e8170"></a-box>
            <a-box position="0.9 0.35 0.35" width="0.1" height="0.7" depth="0.1" color="#9e8170"></a-box>
            
            <a-entity id="obj-laptop" class="clickable" position="0 0.85 0"
                data-title="Laptop (Autoavaliação)"
                data-content="💻 <b>Triagem de Sintomas:</b> Ferramentas como RAADS-R podem te ajudar a entender sua neurodivergência. <br><br> <div class='disclaimer'>⚠️ <b>IMPORTANTE:</b> Este teste não substitui um diagnóstico oficial. O diagnóstico deve ser realizado por um <b>Neuropsicólogo</b> ou <b>Psiquiatra</b> especializado.</div>">
                <a-box width="0.8" height="0.05" depth="0.6" color="#222" material="roughness: 0.1; metalness: 0.5"></a-box>
                <a-entity look-at="[camera]" position="0 0.4 0">
                    <a-text value="AVALIAÇÃO" align="center" width="4" color="#4a90e2" font="exo2bold"></a-text>
                </a-entity>
            </a-entity>
        </a-entity>

    </a-scene>

    <script type="module" src="./main.js"></script>
</body>
</html>
