<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abril Azul - Refúgio Sensorial</title>
    <!-- SEO -->
    <meta name="description" content="Um refúgio sensorial imersivo para adultos em busca de diagnóstico de autismo. Informação, acolhimento e validação.">
    
    <!-- A-Frame and Components -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <!-- Icons and Fonts -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Overlay UI -->
    <div id="ui-overlay" class="ui-overlay">
        <header>
            <div class="logo-container">
                <i class="ph-bold ph-brain"></i>
                <h1>ABRIL AZUL | REFÚGIO SENSORIAL</h1>
            </div>
            <p>Explore o ambiente focando nos pontos de interesse</p>
        </header>

        <!-- Dynamic Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content glass">
                <span class="close-button"><i class="ph ph-x"></i></span>
                <div id="modal-body">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <footer>
            <button id="btn-toggle-audio" class="btn-audio">
                <i class="ph-bold ph-speaker-slash"></i> Áudio Ambiente
            </button>
        </footer>
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        id="main-scene"
        renderer="antialias: true; colorManagement: true; exposure: 1.2; shadowMapEnabled: true; shadowMapType: pcfsoft"
        loading-screen="backgroundColor: #ffffff; dotsColor: #007bff"
    >
        <!-- Assets -->
        <a-assets>
            <audio id="ambient-sound" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" preload="auto" loop="true"></audio>
        </a-assets>

        <!-- Room Architecture (White Tech Studio) -->
        <a-sky color="#ffffff"></a-sky> 
        
        <!-- Floor & Rug (Matte White/Gray) -->
        <a-plane id="floor" position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#f0f0f0" material="roughness: 0.9" shadow="receive: true"></a-plane>
        <a-plane id="rug" position="0 0.01 0" rotation="-90 0 0" width="4" height="4" color="#e0e0e0" material="opacity: 0.8; roughness: 1"></a-plane>

        <!-- Walls (Professional Grayish White) -->
        <a-box id="wall-front" position="0 2.5 -5" width="12" height="5" depth="0.1" color="#f5f5f5" shadow="receive: true"></a-box>
        <a-box id="wall-left" position="-6 2.5 0" rotation="0 90 0" width="12" height="5" depth="0.1" color="#f5f5f5"></a-box>
        <a-box id="wall-right" position="6 2.5 0" rotation="0 -90 0" width="12" height="5" depth="0.1" color="#ededed"></a-box>
        <a-box id="ceiling" position="0 5 0" rotation="90 0 0" width="12" height="12" depth="0.1" color="#ffffff"></a-box>

        <!-- Studio Lighting Setup (Focused & Soft) -->
        <a-entity id="studio-lights">
            <a-light type="ambient" color="#fff" intensity="0.4"></a-light>
            <!-- Key Light (Mimicking a large softbox from the left) -->
            <a-light type="spot" position="-4 4 2" target="#floor" intensity="0.8" angle="60" penumbra="0.5" castShadow="true" color="#fff"></a-light>
            <!-- Fill Light (Softer from the right) -->
            <a-light type="point" position="4 3 1" intensity="0.3" distance="10" color="#e0f0ff"></a-light>
            <!-- Accent Light (From window side) -->
            <a-light type="directional" position="-5 3 -2" intensity="0.5" color="#ffffff"></a-light>
        </a-entity>

        <!-- Window (Minimalist High-Tech) -->
        <a-box id="window-frame" position="-5.94 2.2 0" rotation="0 90 0" width="3.2" height="3.2" depth="0.1" color="#ffffff"></a-box>
        <a-plane id="window-glass" position="-5.88 2.2 0" rotation="0 90 0" width="3" height="3" color="#ffffff" material="opacity: 0.9; shader: flat"></a-plane>

        <!-- Camera + Custom Inverted Controls -->
        <a-entity id="rig" position="0 0 2">
            <a-entity camera look-controls="reverseMouseDrag: true; touchEnabled: true" inverted-look position="0 1.6 0">
                <a-entity 
                    id="cursor"
                    cursor="fuse: true; fuseTimeout: 1500"
                    position="0 0 -1"
                    geometry="primitive: ring; radius-inner: 0.015; radius-outer: 0.025"
                    material="color: #007bff; shader: flat; opacity: 0.9"
                    raycaster="objects: .clickable"
                    animation__fusing="property: scale; from: 1 1 1; to: 0.2 0.2 0.2; dur: 1500; startEvents: fusing"
                    animation__mouseleave="property: scale; from: 0.2 0.2 0.2; to: 1 1 1; dur: 500; startEvents: mouseleave"
                >
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- REFINED INTERACTIVE OBJECTS (High Detail / AR Style) -->
        
        <!-- 1. The Mirror (Masking) -->
        <a-entity id="group-mirror" position="-3 0 -3.5" rotation="0 30 0">
            <!-- Frame with internal beveled parts -->
            <a-box position="0 1.25 0" width="1.1" height="2.1" depth="0.15" color="#ffffff" shadow="cast: true"></a-box>
            <a-box id="obj-mirror" class="clickable" position="0 1.25 0.08" width="0.95" height="1.95" depth="0.02" 
                   color="#e6f3ff" material="metalness: 0.9; roughness: 0.05; emissive: #ffffff; emissiveIntensity: 0.05"
                   data-title="O Espelho (Autoconhecimento)"
                   data-content="<b>Social Masking</b>: A camuflagem de traços para se adequar ao ambiente. <br><br> 🩺 Reconhecer o Masking é o primeiro passo para o acolhimento.">
                <!-- HUD Tag -->
                <a-entity look-at="[camera]" position="0 1.1 0.1">
                    <a-plane width="1.2" height="0.3" color="#007bff" material="opacity: 0.8">
                        <a-text value="CONCEITO: MASKING" align="center" width="3" color="#ffffff"></a-text>
                    </a-plane>
                </a-entity>
            </a-box>
        </a-entity>

        <!-- 2. The Bookshelf (Resources) -->
        <a-entity id="group-bookshelf" position="3.5 0 -3" rotation="0 -30 0">
            <a-box position="0 1.25 0" width="1.8" height="2.5" depth="0.4" color="#ffffff" shadow="cast: true">
                <!-- Technical detailing: Shelf inserts -->
                <a-box position="0 0.5 0.15" width="1.7" height="0.05" depth="0.25" color="#efefef"></a-box>
                <a-box position="0 -0.5 0.15" width="1.7" height="0.05" depth="0.25" color="#efefef"></a-box>
            </a-box>
            <a-entity id="obj-bookshelf" class="clickable" position="0 1.25 0.25" 
                data-title="Recursos & Apoio"
                data-content="Bibliotecas digitais e comunidades de apoio técnico. <br><br> 🔍 Busque evidências científicas e relatos de adultos autistas diagnosticados.">
                <a-entity look-at="[camera]">
                    <a-plane width="1.2" height="0.3" color="#007bff" material="opacity: 0.8">
                        <a-text value="RECURSOS" align="center" width="3" color="#ffffff"></a-text>
                    </a-plane>
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- 3. The Headphones (Sensory White) -->
        <a-entity id="group-headphones" position="-5 1.8 1" rotation="0 90 0">
            <a-sphere id="obj-headphones" class="clickable" radius="0.35" color="#ffffff" 
                      material="metalness: 0.5; roughness: 0.1" 
                      shadow="cast: true"
                      data-title="Conforto Sensorial"
                      data-content="Hipersensibilidade auditiva: Sons de ventiladores ou trânsito podem ser processados com a mesma intensidade de um grito.">
                <!-- Technological details -->
                <a-torus radius="0.4" radius-tubular="0.01" color="#007bff" rotation="0 90 0"></a-torus>
                <a-entity look-at="[camera]" position="0 0.6 0">
                    <a-text value="AUDIÇÃO" align="center" width="3" color="#007bff" font="exo2bold"></a-text>
                </a-entity>
            </a-sphere>
        </a-entity>

        <!-- 4. The Laptop (Pro Desk Setup) -->
        <a-entity id="group-laptop" position="0 0 -2.5">
            <!-- Studio Desk -->
            <a-box position="0 0.7 0" width="2.2" height="0.08" depth="0.8" color="#ffffff" shadow="cast: true"></a-box>
            <a-box position="-1 0.35 0.3" width="0.12" height="0.7" depth="0.12" color="#ededed"></a-box>
            <a-box position="1 0.35 0.3" width="0.12" height="0.7" depth="0.12" color="#ededed"></a-box>
            
            <a-entity id="obj-laptop" class="clickable" position="0 0.85 0" 
                data-title="Autoavaliação (RAADS-R)"
                data-content="Ferramentas online auxiliam no entendimento, mas não são diagnósticos. <br><br> <div class='disclaimer'>⚠️ <b>Sugerimos:</b> Procure um <b>Neuropsicólogo</b> ou <b>Psiquiatra</b> especializado para um diagnóstico oficial.</div>">
                <a-box width="0.8" height="0.04" depth="0.55" color="#111" material="roughness: 0.1; metalness: 0.8"></a-box>
                <a-box position="0 0.25 -0.25" rotation="-50 0 0" width="0.8" height="0.04" depth="0.55" color="#111"></a-box> <!-- Open Screen -->
                <a-entity look-at="[camera]" position="0 0.5 0">
                    <a-plane width="1.4" height="0.3" color="#007bff" material="opacity: 0.8">
                        <a-text value="TRIAGEM & ORIENTAÇÃO" align="center" width="3" color="#ffffff"></a-text>
                    </a-plane>
                </a-entity>
            </a-entity>
        </a-entity>

    </a-scene>
    </a-scene>

    <script type="module" src="./main.js"></script>
</body>
</html>
