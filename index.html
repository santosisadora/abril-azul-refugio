<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abril Azul - Refúgio Sensorial</title>
    <!-- SEO -->
    <meta name="description" content="Um refúgio sensorial imersivo para adultos em busca de diagnóstico de autismo. Informação, acolhimento e validação.">
    
    <!-- A-Frame and MindAR -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Overlay UI -->
    <div id="ui-overlay" class="ui-overlay">
        <header>
            <h1>Refúgio Sensorial</h1>
            <p>Explore o ambiente focando nos objetos</p>
        </header>

        <!-- Modal System -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-button">&times;</span>
                <div id="modal-body">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <footer>
            <button id="btn-toggle-audio" class="btn-audio">🔇 Iniciar Áudio Ambiente</button>
        </footer>
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        id="main-scene"
        cursor="rayOrigin: mouse; fuse: true; fuseTimeout: 1500"
        raycaster="objects: .clickable"
        embedded
        renderer="antialias: true; colorManagement: true;"
    >
        <!-- Assets -->
        <a-assets>
            <audio id="ambient-sound" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" preload="auto" loop="true"></audio>
        </a-assets>

        <!-- Environment -->
        <a-sky color="#f8f1e5"></a-sky> <!-- Warm cream background -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#e8dfd1" shadow></a-plane> <!-- Added Floor -->
        
        <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
        <a-light type="directional" position="-1 2 1" intensity="0.5" castShadow="true"></a-light>

        <!-- Camera + Gaze Cursor -->
        <a-entity id="rig" position="0 0 0">
            <a-entity camera look-controls position="0 1.6 0">
                <a-entity 
                    id="cursor"
                    cursor="fuse: true; fuseTimeout: 1500"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                    material="color: #4a90e2; shader: flat; opacity: 0.8"
                    raycaster="objects: .clickable"
                    animation__fusing="property: scale; from: 1 1 1; to: 0.3 0.3 0.3; dur: 1500; startEvents: fusing"
                    animation__mouseleave="property: scale; from: 0.3 0.3 0.3; to: 1 1 1; dur: 500; startEvents: mouseleave"
                >
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- Interactive Objects -->
        
        <!-- 1. The Mirror (Masking) -->
        <a-box 
            id="obj-mirror"
            class="clickable"
            position="-2 1.5 -4"
            rotation="0 45 0"
            width="1" height="1.5" depth="0.1"
            color="#a8d8ea"
            material="roughness: 0.1; metalness: 0.5; color: #a8d8ea"
            data-title="O Espelho (Masking)"
            data-content="Social Masking (Camuflagem Social) é o esforço consciente ou inconsciente de imitar comportamentos neurotípicos para se 'encaixar'. No autismo adulto, isso leva a um esgotamento severo conhecido como Burnout Autista."
        >
            <a-text value="ESPELHO" align="center" position="0 0 0.06" width="3" color="#333"></a-text>
        </a-box>

        <!-- 2. The Bookshelf (Info) -->
        <a-box 
            id="obj-bookshelf"
            class="clickable"
            position="2 1 -5"
            width="1.5" height="2" depth="0.5"
            color="#f38181"
            material="color: #f38181"
            data-title="Estante de Conhecimento"
            data-content="Informar-se é o primeiro passo para o autoconhecimento. Recomendamos sites como ABRAÇA e leituras sobre diagnóstico tardio. <br><br> <a href='https://abraca.net.br' target='_blank'>Visitar ABRAÇA</a>"
        >
            <a-text value="LIVROS" align="center" position="0 0 0.26" width="3" color="#333"></a-text>
        </a-box>

        <!-- 3. The Headphones (Sensory) -->
        <a-sphere 
            id="obj-headphones"
            class="clickable"
            position="-3 1.2 0"
            radius="0.4"
            color="#fce38a"
            material="color: #fce38a"
            data-title="Experiência Sensorial"
            data-content="A hipersensibilidade auditiva pode transformar sons comuns em sobrecarga sensorial. Explore como o ruído branco pode ajudar ou como a filtragem de sons é diferente para neurodivergentes."
        >
            <a-text value="SOM" align="center" position="0 0.5 0" width="3" color="#333"></a-text>
        </a-sphere>

        <!-- 4. The Laptop (Assessment) -->
        <a-box 
            id="obj-laptop"
            class="clickable"
            position="0 0.8 -2.5"
            width="0.8" height="0.05" depth="0.6"
            color="#95e1d3"
            material="color: #95e1d3"
            data-title="Autoavaliação"
            data-content="Testes como o RAADS-R e AQ-10 são ferramentas de triagem, não diagnósticos definitivos. Procure sempre um profissional especializado.<br><br><a href='https://embrace-autism.com/raads-r/' target='_blank'>Fazer teste RAADS-R</a>"
        >
            <a-text value="LAPTOP" align="center" position="0 0.03 0" width="3" color="#333" rotation="-90 0 0"></a-text>
        </a-box>

        <!-- 5. Collection Niche (Hyperfocus) -->
        <a-box 
            id="obj-hyperfocus"
            class="clickable"
            position="3 1.5 -1"
            rotation="0 -30 0"
            width="0.7" height="0.7" depth="0.7"
            color="#aa96da"
            material="color: #aa96da"
            data-title="Hiperfoco"
            data-content="O hiperfoco é uma concentração intensa em temas de interesse profundo. Na fase adulta, pode ser um grande aliado profissional, mas exige equilíbrio para não negligenciar outras áreas."
        >
            <a-text value="COLEÇÃO" align="center" position="0 0 0.36" width="3" color="#333"></a-text>
        </a-box>

    </a-scene>

    <script type="module" src="./main.js"></script>
</body>
</html>
