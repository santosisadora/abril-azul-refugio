<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abril Azul - Refúgio Sensorial</title>
    <!-- SEO -->
    <meta name="description" content="Um refúgio sensorial imersivo para adultos em busca de diagnóstico de autismo. Informação, acolhimento e validação.">
    
    <!-- A-Frame and Components -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <!-- Icons and Fonts -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Overlay UI -->
    <div id="ui-overlay" class="ui-overlay">
        <header>
            <div class="logo-container">
                <i class="ph-bold ph-brain"></i>
                <h1>ABRIL AZUL | REFÚGIO SENSORIAL</h1>
            </div>
            <p>Explore o ambiente focando nos pontos de interesse</p>
        </header>

        <!-- Dynamic Modal -->
        <div id="modal" class="modal hidden">
            <div class="modal-content glass">
                <span class="close-button"><i class="ph ph-x"></i></span>
                <div id="modal-body">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <footer>
            <button id="btn-toggle-audio" class="btn-audio">
                <i class="ph-bold ph-speaker-slash"></i> Áudio Ambiente
            </button>
        </footer>
    </div>

    <!-- A-Frame Scene -->
    <a-scene 
        id="main-scene"
        renderer="antialias: true; colorManagement: true; exposure: 1.1; shadowMapEnabled: true"
        loading-screen="backgroundColor: #f8f1e5; dotsColor: #4a90e2"
    >
        <!-- Assets -->
        <a-assets>
            <audio id="ambient-sound" src="https://cdn.aframe.io/basic-guide/audio/backgroundnoise.wav" preload="auto" loop="true"></audio>
        </a-assets>

        <!-- Room Architecture (The Safe Room) -->
        <a-sky color="#f8f1e5"></a-sky> 
        
        <!-- Floor & Walls -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#f2e9e4" material="roughness: 0.8" shadow="receive: true"></a-plane>
        <a-box position="0 2.5 -5" width="10" height="5" depth="0.1" color="#f2e9e4" material="roughness: 1" shadow="receive: true"></a-box> <!-- Front Wall -->
        <a-box position="-5 2.5 0" rotation="0 90 0" width="10" height="5" depth="0.1" color="#f2e9e4" material="roughness: 1"></a-box> <!-- Left Wall -->
        <a-box position="5 2.5 0" rotation="0 -90 0" width="10" height="5" depth="0.1" color="#c9ada7" material="roughness: 1"></a-box> <!-- Right Wall (Accent) -->
        <a-box position="0 5 0" rotation="90 0 0" width="10" height="10" depth="0.1" color="#f2e9e4"></a-box> <!-- Ceiling -->

        <!-- Window (Light Source) -->
        <a-plane id="window" position="-4.94 2.2 0" rotation="0 90 0" width="3" height="3" color="#fff" material="shader: flat; opacity: 0.9"></a-plane>
        <a-light type="directional" position="-5 4 0" target="#main-scene" intensity="0.8" color="#fff1e0" castShadow="true"></a-light>
        <a-light type="ambient" color="#fff" intensity="0.5"></a-light>

        <!-- Camera + Gaze Cursor -->
        <a-entity id="rig" position="0 0 0">
            <a-entity camera look-controls position="0 1.6 0">
                <a-entity 
                    id="cursor"
                    cursor="fuse: true; fuseTimeout: 1500"
                    position="0 0 -1"
                    geometry="primitive: ring; radius-inner: 0.02; radius-outer: 0.03"
                    material="color: #4a90e2; shader: flat; opacity: 0.8"
                    raycaster="objects: .clickable"
                    animation__fusing="property: scale; from: 1 1 1; to: 0.3 0.3 0.3; dur: 1500; startEvents: fusing"
                    animation__mouseleave="property: scale; from: 0.3 0.3 0.3; to: 1 1 1; dur: 500; startEvents: mouseleave"
                >
                </a-entity>
            </a-entity>
        </a-entity>

        <!-- DESIGNATED HOTSPOTS AND OBJECTS -->
        
        <!-- 1. The Mirror (Masking) -->
        <a-entity position="-2 0 -4.5">
            <!-- Mirror Body -->
            <a-box 
                id="obj-mirror"
                class="clickable"
                position="0 1.2 0"
                width="1" height="2" depth="0.05"
                color="#f8f1e5"
                material="roughness: 0.1; metalness: 0.8"
                data-title="O Espelho"
                data-content="Social Masking é a camuflagem de traços autistas para se ajustar socialmente. <br><br> 🎭 <b>A Camuflagem Social:</b> Pode causar esgotamento extremo e perda de identidade."
            >
                <a-text value="CONCEITO DE MASKING" look-at="[camera]" position="0 1.2 0" align="center" width="3" color="#4a90e2"></a-text>
            </a-box>
            <!-- Hotspot Base -->
            <a-circle rotation="-90 0 0" radius="0.3" color="#4a90e2" opacity="0.5" animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000"></a-circle>
        </a-entity>

        <!-- 2. The Bookshelf (Resources) -->
        <a-entity position="4.3 0 -3" rotation="0 -30 0">
            <a-box 
                id="obj-bookshelf"
                class="clickable"
                position="0 1.5 0"
                width="1.2" height="2" depth="0.3"
                color="#9a8c98"
                data-title="Estante de Livros"
                data-content="Informação de qualidade é essencial. <br><br> 📚 <b>Recursos:</b> ABRAÇA, Livros sobre Diagnóstico Tardio e Artigos Científicos."
            >
                <a-text value="ESTANTE DE LIVROS" look-at="[camera]" position="0 1.3 0" align="center" width="3" color="#4a90e2"></a-text>
            </a-box>
            <a-circle rotation="-90 0 0" radius="0.3" color="#4a90e2" opacity="0.5"></a-circle>
        </a-entity>

        <!-- 3. The Headphones (Audio Demo) -->
        <a-entity position="-4 1.5 1.5" rotation="0 90 0">
            <a-sphere 
                id="obj-headphones"
                class="clickable"
                radius="0.4"
                color="#4a4a4a"
                data-title="Fone de Ouvido"
                data-content="🎧 <b>Sobrecarga Sensorial:</b> A hipersensibilidade auditiva faz com que sons do dia-a-dia sejam processados como ruídos intensos e exaustivos."
            >
                <a-text value="FONE DE OUVIDO" look-at="[camera]" position="0 0.6 0" align="center" width="3" color="#4a90e2"></a-text>
            </a-sphere>
        </a-entity>

        <!-- 4. The Laptop (Assessment/Disclaimer) -->
        <a-entity position="0 0 -2">
            <a-box 
                id="obj-laptop"
                class="clickable"
                position="0 0.8 0"
                width="0.8" height="0.05" depth="0.6"
                color="#222"
                data-title="Laptop (Autoavaliação)"
                data-content="💻 <b>Triagem de Sintomas:</b> Ferramentas como RAADS-R podem te ajudar a entender sua neurodivergência. <br><br> ⚠️ <b>IMPORTANTE:</b> Este teste não substitui um diagnóstico oficial. O diagnóstico deve ser realizado por um <b>Neuropsicólogo</b> ou <b>Psiquiatra</b> especializado."
            >
                <a-text value="LAPTOP" look-at="[camera]" position="0 0.4 0" align="center" width="3" color="#4a90e2"></a-text>
            </a-box>
            <!-- Desk beneath laptop -->
            <a-box position="0 0.7 0" width="1.5" height="0.05" depth="0.8" color="#9e8170"></a-box>
            <a-box position="-0.7 0.35 0.35" width="0.05" height="0.7" depth="0.05" color="#9e8170"></a-box>
            <a-box position="0.7 0.35 0.35" width="0.05" height="0.7" depth="0.05" color="#9e8170"></a-box>
        </a-entity>

    </a-scene>

    <script type="module" src="./main.js"></script>
</body>
</html>
